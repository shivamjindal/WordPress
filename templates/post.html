{% extends "layout.html" %}

{% block title %}{{ post.title }} · {{ site.title }}{% endblock %}

{% block content %}
  <section class="post_header">
    <a class="muted back_link" href="/">← Back to posts</a>
    <h1>{{ post.title }}</h1>
    <div class="post_meta">{{ post.date }}</div>
    <p class="post_excerpt">{{ post.excerpt }}</p>
  </section>

  <article class="card post_body">
    <div class="prose">
      {{ post.content_html | safe }}
    </div>
  </article>
{% endblock %}
